<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATSH AI | معاينة تجريبية</title><style>:root{font-family:system-ui,Tahoma;color:#203958;background:#f7f8fb}*{box-sizing:border-box}body{margin:0}header{background:#203958;color:white;padding:18px 5%;display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}header strong{font-size:24px;color:#e8c98d}nav{display:flex;gap:8px;flex-wrap:wrap}button,input,select,textarea{font:inherit}nav button,.action{border:1px solid #d7bd86;border-radius:9px;padding:10px 15px;cursor:pointer;background:transparent;color:inherit}nav button[aria-current=page],.action{background:#d7bd86;color:#203958;font-weight:bold}main{max-width:1120px;margin:auto;padding:30px 5%}h1{font-size:clamp(27px,4vw,42px)}p{line-height:1.8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:16px}.card{background:white;border:1px solid #e2e6ef;border-radius:16px;padding:22px}.muted{color:#617089}.badge{display:inline-block;background:#eaf0f7;border-radius:20px;padding:5px 12px;font-size:12px}.card button{margin-top:12px}.field{display:grid;gap:6px;margin-bottom:15px}input,select,textarea{border:1px solid #aeb7c5;border-radius:9px;padding:12px;width:100%;background:white;color:#203958}.hero{background:#203958;color:white;border-radius:20px;padding:32px}.hero p{color:#e0e6ed}.hero .action{margin-top:10px}.notice{border-right:4px solid #b28b4e;background:#fff7e8;padding:12px 16px;border-radius:7px}footer{text-align:center;padding:24px;color:#617089}button:focus-visible{outline:3px solid #4b91ef;outline-offset:2px}@media(max-width:500px){header{display:block}nav{margin-top:14px}nav button{flex:1}main{padding:20px 4%}}</style></head><body><header><strong>ATSH AI <small style="font-size:11px;color:white">PREVIEW</small></strong><nav aria-label="التنقل"><button data-page="home">الرئيسية</button><button data-page="services">الخدمات</button><button data-page="catalog">المشاريع</button><button data-page="orders">طلب مشروع</button><button data-page="admin">لوحة الإدارة</button></nav></header><main id="app"></main><footer>ATSH AI — معاينة مستقلة ببيانات تجريبية، غير متصلة بسيرفر الإنتاج</footer><script>
const templates=[{name:"المتجر الإلكتروني",slug:"marketplace",sector:"التجارة الإلكترونية",type:"منظومة متكاملة",status:"مسودة",description:"واجهة متجر ولوحة بائع وإدارة تجريبية.",preview:"projects/marketplace/index.html"},{name:"يونس للمقاولات",slug:"younes-construction",sector:"المقاولات",type:"موقع متعدد الصفحات",status:"مسودة",description:"موقع مشاريع وخدمات ولوحة إدارة تجريبية.",preview:"projects/younes/index.html"},{name:"عيادتي",slug:"eyadaty",sector:"العيادات",type:"منظومة متكاملة",status:"مسودة",description:"إدارة عيادة تجريبية تحتاج ربطًا واختبارًا.",preview:"projects/eyadaty/index.html"},{name:"مشكلجي",slug:"mashkalgy",sector:"البث والمشاهدة",type:"منظومة متكاملة",status:"مسودة",description:"معاينة منصة مشاهدة عربية تجريبية.",preview:"projects/mashkalgy/index.html"},{name:"سوبر ماركت",slug:"supermarket",sector:"التجزئة",type:"منظومة متكاملة",status:"مسودة",description:"الفرع المرجعي لا يتضمن كامل حزمة الكود."},{name:"BOB",slug:"bob-security",sector:"أمن الأجهزة",type:"منظومة متكاملة",status:"مسودة",description:"نموذج أولي غير جاهز للتشغيل التجاري."}];const app=document.getElementById("app");const safe=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const button=(label,page)=>'<button class="action" data-go="'+page+'">'+label+'</button>';const card=t=>'<article class="card"><span class="badge">'+safe(t.type)+'</span><h2>'+safe(t.name)+'</h2><p class="muted">'+safe(t.sector)+'</p><p>'+safe(t.description)+'</p>'+button("عرض التفاصيل","project/"+t.slug)+(t.preview?' <a class="action" href="'+safe(t.preview)+'" target="_blank" rel="noopener noreferrer">فتح المعاينة الفعلية ↗</a>':'')+'</article>';function render(){let page=decodeURIComponent(location.hash.slice(1)||"home");document.querySelectorAll("nav button").forEach(b=>{if(b.dataset.page===page)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});if(page==="home")app.innerHTML='<section class="hero"><span class="badge" style="color:#203958">ATSH AI — منصة الخدمات الذكية</span><h1>ابنِ مشروعك الرقمي من مكان واحد</h1><p>مواقع إلكترونية، أنظمة أعمال، وتطبيقات مع لوحة تحكم ومكتبة قوالب قابلة للتطوير.</p>'+button("استعرض المشاريع","catalog")+' '+button("ابدأ طلبك","orders")+'</section><h2>منظومات متاحة للاستعراض</h2><div class="grid">'+templates.slice(0,3).map(card).join("")+'</div>';else if(page==="services")app.innerHTML='<h1>خدماتنا</h1><div class="grid">'+["مواقع متعددة الصفحات","منظومات إدارة متكاملة","متاجر إلكترونية","مساعد ذكي للعملاء","تطبيقات هاتف","تكاملات وأتمتة n8n"].map(x=>'<article class="card"><h2>'+x+'</h2><p>حل قابل للتخصيص وفق احتياجات المشروع.</p>'+button("اطلب الخدمة","orders")+'</article>').join("")+'</div>';else if(page==="catalog")app.innerHTML='<h1>مكتبة المشاريع</h1><p class="notice">النماذج التالية قيد التطوير والمراجعة، وليست منتجات منشورة للبيع.</p><label class="field">ابحث عن مشروع<input id="search" placeholder="اسم المشروع أو القطاع"></label><div id="results" class="grid">'+templates.map(card).join("")+'</div>';else if(page.startsWith("project/")){const t=templates.find(x=>x.slug===page.split("/")[1]);app.innerHTML=t?'<p>'+button("← العودة للمشاريع","catalog")+'</p><section class="card"><span class="badge">'+safe(t.status)+'</span><h1>'+safe(t.name)+'</h1><p>'+safe(t.description)+'</p><p><b>القطاع:</b> '+safe(t.sector)+'</p><p><b>النوع:</b> '+safe(t.type)+'</p><p class="notice">معاينة تعريفية للقالب، وليست تشغيلًا للمنتج الأصلي.</p>'+(t.preview?'<p><a class="action" href="'+safe(t.preview)+'" target="_blank" rel="noopener noreferrer">فتح معاينة المشروع ↗</a></p>':'')+button("اطلب مشروعًا مشابهًا","orders")+'</section>':'<h1>المشروع غير موجود</h1>';}else if(page==="orders")app.innerHTML='<h1>اطلب مشروعك</h1><p>نموذج محاكاة لمسار الطلب، ولا يرسل بيانات إلى خادم.</p><form id="order" class="card"><label class="field">نوع المشروع<select required><option>موقع متعدد الصفحات</option><option>منظومة متكاملة</option><option>متجر إلكتروني</option><option>مساعد ذكي</option></select></label><label class="field">وصف الطلب<textarea required maxlength="1000" rows="4" placeholder="اكتب احتياجات مشروعك"></textarea></label><button class="action">معاينة إرسال الطلب</button><p id="order-result" role="status"></p></form>';else if(page==="admin")app.innerHTML='<h1>لوحة إدارة القوالب</h1><p class="notice">لوحة تجريبية بدون تسجيل دخول حقيقي. التغييرات مؤقتة داخل الصفحة فقط.</p><div class="grid"><div class="card"><h2>'+templates.length+'</h2><p>إجمالي القوالب</p></div><div class="card"><h2>'+templates.filter(t=>t.status==="قيد المراجعة").length+'</h2><p>قيد المراجعة</p></div><div class="card"><h2>0</h2><p>منشورة</p></div></div><h2>إدارة النماذج</h2><div class="grid">'+templates.map((t,i)=>'<article class="card"><h3>'+safe(t.name)+'</h3><p>الحالة: '+safe(t.status)+'</p><button class="action" data-review="'+i+'">'+(t.status==="مسودة"?"إرسال للمراجعة":"إرجاع لمسودة")+'</button></article>').join("")+'</div><section class="card" style="margin-top:18px"><h2>إضافة قالب</h2><form id="add"><label class="field">اسم القالب<input name="name" required maxlength="100"></label><label class="field">القطاع<input name="sector" required maxlength="80"></label><button class="action">إضافة كمسودة</button></form></section>';else{location.hash="home";return;}document.title="ATSH AI | "+page;const search=document.getElementById("search");if(search)search.addEventListener("input",()=>{const q=search.value.trim().toLowerCase();document.getElementById("results").innerHTML=templates.filter(t=>(t.name+" "+t.sector).toLowerCase().includes(q)).map(card).join("")||"<p>لا توجد نتائج.</p>"});const order=document.getElementById("order");if(order)order.addEventListener("submit",e=>{e.preventDefault();document.getElementById("order-result").textContent="تمت محاكاة إرسال الطلب بنجاح. لم تُحفظ بياناتك ولم يُرسل طلب حقيقي."});const add=document.getElementById("add");if(add)add.addEventListener("submit",e=>{e.preventDefault();const f=new FormData(add);templates.push({name:String(f.get("name")).trim(),sector:String(f.get("sector")).trim(),slug:"local-"+templates.length,type:"منظومة متكاملة",status:"مسودة",description:"قالب مضاف للمعاينة فقط."});render()});}document.addEventListener("click",e=>{const go=e.target.closest("[data-go]");if(go)location.hash=go.dataset.go;const review=e.target.closest("[data-review]");if(review){const t=templates[Number(review.dataset.review)];t.status=t.status==="مسودة"?"قيد المراجعة":"مسودة";render()}});window.addEventListener("hashchange",render);render();
</script></body></html>
