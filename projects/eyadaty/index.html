<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عيادتي | إدارة العيادة</title><style>
:root{font-family:system-ui,Tahoma,sans-serif;color:#153044;background:#f3f7fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 16px;background:#087e91;color:white}button.secondary{background:#e7f2f5;color:#176070}button.danger{background:#fce8e8;color:#a32c2c}.layout{display:grid;grid-template-columns:225px 1fr;min-height:100vh}aside{background:#083545;color:#fff;padding:24px 15px}aside h1{font-size:28px;margin:0 10px 8px}aside p{margin:0 10px 26px;color:#b3d4da}nav button{display:block;width:100%;text-align:right;margin:5px 0;background:transparent;color:#dce9ec}nav button.active,nav button:hover{background:#176175}main{padding:26px;min-width:0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px}.top h2{margin:0}.muted{color:#607889;font-size:14px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card,.panel{background:white;border:1px solid #e2ecf1;border-radius:15px;padding:19px}.card strong{font-size:30px;display:block;margin-top:12px;color:#0b6b7d}.panel{margin-top:18px}.panel h3{margin:0 0 18px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px;text-align:right}th,td{padding:13px;border-bottom:1px solid #edf1f3}th{color:#607889;font-weight:600}input,select,textarea{width:100%;padding:11px;border:1px solid #cbdde4;border-radius:9px;background:white;min-width:0}label{display:block;font-size:14px;color:#496678}form.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}form.grid .wide{grid-column:1/-1}dialog{border:0;border-radius:15px;padding:25px;width:min(540px,95%);box-shadow:0 15px 70px #15304438}dialog::backdrop{background:#001e2b88}.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#e6f6f2;border-radius:30px;padding:4px 9px;color:#08604e;white-space:nowrap}.notice{padding:12px;background:#fff6da;border-radius:9px;color:#765b19}.empty{text-align:center;color:#79909d;padding:24px}@media(max-width:850px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.layout{display:block}aside{padding:14px}aside h1{font-size:22px}aside p{margin-bottom:8px}nav{display:flex;overflow:auto;gap:5px}nav button{white-space:nowrap;width:auto;font-size:13px}main{padding:14px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}form.grid{grid-template-columns:1fr}.card{padding:13px}.card strong{font-size:24px}}</style></head>
<body><div class="layout"><aside><h1>🩺 عيادتي</h1><p>لوحة إدارة الطبيب</p><nav id="nav"></nav></aside><main><header class="top"><div><h2 id="heading">الرئيسية</h2><div class="muted">نسخة تفاعلية تجريبية — بيانات وهمية، بدون اتصال بالخادم</div></div><div class="actions"><button class="secondary" id="export">تصدير بيانات العرض</button><button class="secondary" id="reset">إعادة ضبط العرض</button></div></header><div id="view"></div><p id="message" class="muted" role="status" aria-live="polite"></p></main></div><dialog id="dlg"><div class="row"><h3 id="formTitle"></h3><button type="button" class="secondary" id="close">إغلاق</button></div><form id="form" class="grid"></form></dialog>
<script>
(()=>{'use strict';const root=document,nav=root.querySelector('#nav'),view=root.querySelector('#view'),dlg=root.querySelector('#dlg'),form=root.querySelector('#form'),msg=root.querySelector('#message');
const pages={dashboard:'الرئيسية',patients:'المرضى',appointments:'المواعيد',visits:'الكشوفات',prescriptions:'الروشتات',invoices:'الحسابات',settings:'إعدادات العيادة'};
const seed=()=>({patients:[{id:1,name:'مريض تجريبي ١',phone:'01000000001',age:33,notes:'بيانات تجريبية'},{id:2,name:'مريض تجريبي ٢',phone:'01000000002',age:45,notes:''}],appointments:[{id:1,patient:1,date:new Date().toISOString().slice(0,10),time:'10:00',status:'مؤكد'},{id:2,patient:2,date:new Date().toISOString().slice(0,10),time:'11:30',status:'انتظار'}],visits:[{id:1,patient:1,date:new Date().toISOString().slice(0,10),complaint:'متابعة تجريبية',diagnosis:'نموذج غير طبي',plan:'لا توجد توصية طبية'}],prescriptions:[],invoices:[{id:1,patient:1,amount:300,status:'مدفوع',date:new Date().toISOString().slice(0,10)}],settings:{clinic:'عيادتي',doctor:'د. الطبيب',specialty:'عيادة عامة',fee:300}});
let data=seed(),page='dashboard',editing=null;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const patientName=id=>data.patients.find(p=>p.id===Number(id))?.name||'مريض محذوف';const today=()=>new Date().toISOString().slice(0,10);const money=v=>Number(v||0).toLocaleString('ar-EG')+' ج.م';const fields={patients:[['name','اسم المريض','text',true],['phone','رقم الهاتف','tel',true],['age','العمر','number',true],['notes','ملاحظات','textarea']],appointments:[['patient','المريض','patient',true],['date','التاريخ','date',true],['time','الساعة','time',true],['status','الحالة','select:انتظار|مؤكد|مكتمل|ملغي',true]],visits:[['patient','المريض','patient',true],['date','التاريخ','date',true],['complaint','الشكوى','textarea',true],['diagnosis','التشخيص','textarea'],['plan','الخطة العلاجية','textarea']],prescriptions:[['patient','المريض','patient',true],['date','التاريخ','date',true],['medications','الأدوية والتعليمات','textarea',true]],invoices:[['patient','المريض','patient',true],['amount','المبلغ بالجنيه','number',true],['date','التاريخ','date',true],['status','الحالة','select:غير مدفوع|مدفوع|جزئي',true]]};
const cols={patients:[['name','الاسم'],['phone','الهاتف'],['age','العمر']],appointments:[['patient','المريض'],['date','التاريخ'],['time','الوقت'],['status','الحالة']],visits:[['patient','المريض'],['date','التاريخ'],['complaint','الشكوى'],['diagnosis','التشخيص']],prescriptions:[['patient','المريض'],['date','التاريخ'],['medications','المحتوى']],invoices:[['patient','المريض'],['amount','المبلغ'],['status','الحالة'],['date','التاريخ']]};
function render(){nav.innerHTML=Object.entries(pages).map(([k,v])=>'<button type="button" data-page="'+k+'" class="'+(k===page?'active':'')+'">'+esc(v)+'</button>').join('');root.querySelector('#heading').textContent=pages[page];if(page==='dashboard')dashboard();else if(page==='settings')settings();else list();}
function dashboard(){const ap=data.appointments.filter(x=>x.date===today());const total=data.invoices.filter(x=>x.status==='مدفوع').reduce((n,x)=>n+Number(x.amount),0);view.innerHTML='<div class="cards">'+[['المرضى',data.patients.length],['مواعيد اليوم',ap.length],['الكشوفات',data.visits.length],['إيراد مدفوع',money(total)]].map(([k,v])=>'<div class="card"><span class="muted">'+k+'</span><strong>'+v+'</strong></div>').join('')+'</div><section class="panel"><div class="row"><h3>جدول اليوم</h3><button type="button" data-add="appointments">إضافة موعد</button></div>'+table('appointments',ap)+'</section><section class="panel"><h3>اختصارات</h3><div class="actions"><button type="button" data-add="patients">مريض جديد</button><button type="button" data-add="visits">تسجيل كشف</button><button type="button" data-add="prescriptions">روشتة</button><button type="button" data-add="invoices">فاتورة</button></div></section>';}
function table(type,rows){if(!rows.length)return '<div class="empty">لا توجد سجلات حاليًا</div>';return '<div class="table-wrap"><table><thead><tr>'+cols[type].map(c=>'<th>'+c[1]+'</th>').join('')+'<th>إجراءات</th></tr></thead><tbody>'+rows.map(r=>'<tr>'+cols[type].map(([k])=>'<td>'+(k==='patient'?esc(patientName(r[k])):k==='amount'?money(r[k]):esc(r[k]))+'</td>').join('')+'<td><div class="actions"><button type="button" class="secondary" data-edit="'+type+':'+r.id+'">تعديل</button><button type="button" class="danger" data-delete="'+type+':'+r.id+'">حذف</button></div></td></tr>').join('')+'</tbody></table></div>';}
function list(){view.innerHTML='<section class="panel"><div class="row"><h3>'+pages[page]+' ('+data[page].length+')</h3><button type="button" data-add="'+page+'">إضافة جديد</button></div>'+table(page,data[page])+'</section>';}
function control([key,label,type,required],value){let attr=required?' required':'',val=esc(value??(type==='date'?today():''));let el;if(type==='patient')el='<select name="'+key+'"'+attr+'><option value="">اختر المريض</option>'+data.patients.map(p=>'<option value="'+p.id+'"'+(String(value)===String(p.id)?' selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select>';else if(type.startsWith('select:'))el='<select name="'+key+'"'+attr+'>'+type.slice(7).split('|').map(o=>'<option'+(value===o?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';else if(type==='textarea')el='<textarea name="'+key+'" rows="3"'+attr+'>'+val+'</textarea>';else el='<input name="'+key+'" type="'+type+'" value="'+val+'"'+attr+(type==='number'?' min="0" step="any"':'')+'>';return '<label>'+label+el+'</label>';}
function openForm(type,id){editing={type,id};let record=id?data[type].find(x=>x.id===id):{};if(!record)return;root.querySelector('#formTitle').textContent=(id?'تعديل ':'إضافة ')+pages[type];form.innerHTML=fields[type].map(f=>control(f,record[f[0]])).join('')+'<div class="wide"><button type="submit">حفظ</button></div>';dlg.showModal();}
function settings(){view.innerHTML='<section class="panel"><h3>بيانات العيادة</h3><form id="settingsForm" class="grid">'+[['clinic','اسم العيادة'],['doctor','اسم الطبيب'],['specialty','التخصص'],['fee','سعر الكشف']].map(([k,l])=>'<label>'+l+'<input name="'+k+'" value="'+esc(data.settings[k])+'" '+(k==='fee'?'type="number" min="0"':'required')+'></label>').join('')+'<div class="wide"><button>حفظ الإعدادات</button></div></form></section><div class="notice">هذه نسخة للعرض فقط، لا تُدخل بيانات مرضى حقيقية. لا توجد مصادقة أو تخزين آمن أو اتصال بقاعدة بيانات.</div>';root.querySelector('#settingsForm').addEventListener('submit',e=>{e.preventDefault();data.settings=Object.fromEntries(new FormData(e.target));msg.textContent='تم حفظ إعدادات العرض مؤقتًا';render();});}
nav.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render();}});
view.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.add){openForm(b.dataset.add,null);return;}if(b.dataset.edit){let [t,id]=b.dataset.edit.split(':');openForm(t,Number(id));return;}if(b.dataset.delete){let [t,id]=b.dataset.delete.split(':');if(confirm('حذف السجل التجريبي؟')){data[t]=data[t].filter(x=>x.id!==Number(id));render();}}});
form.addEventListener('submit',e=>{e.preventDefault();if(!editing)return;const {type,id}=editing;let obj=Object.fromEntries(new FormData(form));if(type==='patients'&&Number(obj.age)>125){msg.textContent='العمر غير صالح';return;}if(type==='invoices'&&Number(obj.amount)<0){msg.textContent='المبلغ غير صالح';return;}if(['patients','appointments','visits','prescriptions','invoices'].includes(type)&&!data.patients.length&&type!=='patients'){msg.textContent='أضف مريضًا أولًا';return;}if(id){let i=data[type].findIndex(x=>x.id===id);if(i<0)return;data[type][i]={...data[type][i],...obj};}else{obj.id=Math.max(0,...data[type].map(x=>x.id))+1;data[type].push(obj);}dlg.close();render();msg.textContent='تم حفظ سجل تجريبي';});
root.querySelector('#close').addEventListener('click',()=>dlg.close());root.querySelector('#reset').addEventListener('click',()=>{if(confirm('إعادة ضبط جميع البيانات التجريبية؟')){data=seed();render();msg.textContent='تمت إعادة ضبط العرض';}});root.querySelector('#export').addEventListener('click',()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='eyadaty-demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);});render();})();
</script></body></html>
